# Cancels a pull request's template CI run (template.yml) still going when the pull request
# merges or closes, as the projects' cancel.yml does for their ci.yml (see there for why it's a
# workflow of its own). Here it also tests that pattern live.
name: cancel

on:
  pull_request:
    types: [closed]

permissions: {}

# template.yml's group, by name on purpose: a concurrency group is shared by every workflow in
# the repository, so this run cancels template.yml's run in it.
concurrency:
  group: template-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A workflow needs a job. This one never runs, so it takes no runner: only the run's place in
  # the group matters. (Its condition is never true here; actionlint rejects a constant one.)
  cancel:
    name: Cancel the pull request's CI run
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: "true"
