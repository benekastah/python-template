# Questions `copier copy` asks, and how it renders template/ with the answers.
_subdirectory: template
_templates_suffix: .jinja
_min_copier_version: "9.19"
# Starting points, the project's own from the start: written once, then never changed by
# `copier update` (though it writes one again if it's gone).
_skip_if_exists:
  - PROJECT_AGENTS.md
  - docs/issues.md
  - docs/roadmap.md
  - README.md
  - .github/workflows/project.yml

# Samples a project rewrites as its own code: `copier update` leaves them alone, even where
# the project deleted one, so a template change to them never reaches existing projects.
# (With `_subdirectory` set, Copier excludes nothing by default.)
_exclude:
  - "{% if _copier_operation == 'update' %}src/{{ package_name }}/cli.py{% endif %}"
  - "{% if _copier_operation == 'update' %}src/{{ package_name }}/__init__.py{% endif %}"
  - "{% if _copier_operation == 'update' %}tests/test_cli.py{% endif %}"

project_name:
  type: str
  help: The project's name, as installed and as its command (e.g. git-stack)
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}
    Lowercase letters, digits and dashes, starting with a letter
    {% endif %}

package_name:
  type: str
  help: The Python package's name, as imported
  default: "{{ project_name | replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Lowercase letters, digits and underscores, starting with a letter
    {% endif %}

description:
  type: str
  help: One line saying what it does

author_name:
  type: str
  help: Your name, for pyproject.toml and the license

author_email:
  type: str
  help: Your email address, for pyproject.toml

github_user:
  type: str
  help: The GitHub user or organization it will live under
  default: benekastah

min_python:
  type: str
  help: The oldest Python it supports
  default: "3.11"
  validator: >-
    {% if not (min_python | regex_search('^3\.[0-9]+$')) %}
    A version like 3.11
    {% endif %}

newest_python:
  type: str
  help: The newest Python CI tests it on
  default: "3.15"
  validator: >-
    {% if not (newest_python | regex_search('^3\.[0-9]+$')) %}
    A version like 3.15
    {% endif %}

# How many CI jobs run each system's tests, with each Python (see dev.py's --shard): more than 1
# for tests that take too long for one job's 5 minutes. Answers, not a file of the project's,
# so ci.yml stays the template's; change one with `uvx copier update --defaults -d NAME=N`.
test_shards_linux:
  type: int
  help: How many CI jobs to split the tests into on Linux (1 unless they take over 4 minutes)
  default: 1
  validator: "{% if test_shards_linux < 1 %}At least 1{% endif %}"

test_shards_macos:
  type: int
  help: How many CI jobs to split the tests into on macOS (1 unless they take over 4 minutes)
  default: 1
  validator: "{% if test_shards_macos < 1 %}At least 1{% endif %}"

test_shards_windows:
  type: int
  help: How many CI jobs to split the tests into on Windows (1 unless they take over 4 minutes)
  default: 1
  validator: "{% if test_shards_windows < 1 %}At least 1{% endif %}"

copyright_year:
  type: str
  help: The year for the license
  default: "{{ '%Y' | strftime }}"

_message_after_copy: |
  Made {{ project_name }} in {{ _copier_conf.dst_path }}. Next:

    cd {{ _copier_conf.dst_path }}
    git init
    python3 dev.py install   # .venv, uv.lock, `{{ project_name }}` on PATH, the git hooks
    python3 dev.py check     # formatting, lint, types, then the tests

  Then commit everything, uv.lock and .copier-answers.yml included.

# Until projects made before ci.yml have all updated: the update that brings ci.yml in deletes
# check.yml without a conflict, even where the project added its own jobs to it.
_message_after_update: |
  If this update deleted .github/workflows/check.yml (see `git status`), CI is now in
  ci.yml (the template's) and project.yml (this project's). Before committing, move any jobs
  the project added to check.yml (`git log -p -- .github/workflows/check.yml`) into
  project.yml, as https://github.com/benekastah/python-template#moving-to-ciyml-from-checkyml
  says.
