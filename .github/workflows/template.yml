# Makes a project from the template and runs its checks with the oldest and newest Python the
# template defaults to, and lints its workflows and this one. On Linux; on macOS and Windows
# too when a pull request changes code that differs per system (and on main). All of it is
# skipped for a docs-only pull request. Like the projects' ci.yml, only for a pull request into
# main: a stacked one runs no job until it targets main and is pushed.
name: template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# As in ci.yml, the jobs also check the pull request's own base: in a GitHub stack, every pull
# request's workflows trigger as if it targeted main.

permissions:
  contents: read

# A pull request's group is its number, the group cancel.yml's run joins when the pull request
# merges or closes, to cancel this run: keep the two names the same. A run that checks nothing
# (see `changes`) is in a group of its own, so it cancels no real run.
concurrency:
  group: >-
    ${{ (github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main')
    && format('template-{0}', github.event.pull_request.number || github.ref)
    || format('template-skipped-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.run_attempt == 1 }}

jobs:
  # Whether anything but docs changed, as in the projects' ci.yml. A pull request touching only
  # the repository's own Markdown skips the other jobs; template/ is what projects get, so a
  # Markdown file there counts as code. main always runs them. No ruleset requires a check
  # here, so skipped jobs need no gate.
  #
  # `platform` is whether a changed file behaves differently per system, so the sample must run
  # on macOS and Windows too. A pull request that changes none of them gets Linux only, which
  # is where a rendering, `copier update` or workflow change shows. It is the files that branch
  # on the platform or run on all of them:
  #   - template/dev.py: WINDOWS, venv's Scripts and .exe, the PATH install.
  #   - template/git_hooks/: sh scripts that pick `py` on Windows.
  #   - template/pyproject.toml.jinja: the tool pins (a version can lack a Windows or macOS wheel)
  #     and the xdist and coverage settings, which only show once installed and run per system.
  #   - template/.gitattributes: keeps the hooks' line endings Unix-style on Windows.
  #   - template/.github/actions/: the setup action every project job runs on each system.
  #   - this file: a change to the matrix should be seen on the systems it builds.
  # main always runs them all.
  #
  # Skipped, and every job after it, for a pull request whose own base isn't main (one in a
  # GitHub stack, above its bottom).
  changes:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      code: ${{ steps.diff.outputs.code }}
      platform: ${{ steps.diff.outputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2  # the merge GitHub would make, and its first parent: the base
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "platform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Its own line, so a failing diff is caught rather than reading as no files (which
          # would skip everything): run everything instead.
          files=$(git diff --name-only --no-renames HEAD^1 HEAD) || {
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "platform=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if printf '%s\n' "$files" | grep -vE '\.md$' | grep -q . ||
            printf '%s\n' "$files" | grep -q '^template/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$files" | grep -qE \
            '^(template/(dev\.py|pyproject\.toml\.jinja|\.gitattributes|git_hooks/.*|\.github/actions/.*)|\.github/workflows/template\.yml)$'; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
          else
            echo "platform=false" >> "$GITHUB_OUTPUT"
          fi

  sample:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5  # at most, as in the projects' ci.yml
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows only where `changes` says the change can differ there: their runners
        # are slower and costlier, and nothing else a pull request changes runs differently.
        os: ${{ fromJSON(needs.changes.outputs.platform == 'true' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        python: ["3.11", "3.15"]
        # The one job that lints the workflows. If the Pythons above change without this, it
        # adds a job of its own rather than linting nowhere.
        include:
          - os: ubuntu-latest
            python: "3.15"
            lint: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Copier renders a commit, and reads the tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}
      - name: Make a project
        shell: bash
        run: |
          uvx copier@9.19.1 copy --defaults --vcs-ref HEAD \
            -d project_name=sample-tool -d "description=A sample tool." \
            -d "author_name=Sample Author" -d author_email=sample@example.com \
            . "$RUNNER_TEMP/sample-tool"
      # As someone would after making it: dev.py then installs from the lock, which in CI
      # (where $CI is set) must already be there. `check` checks the man page `man` made.
      - name: Check it
        shell: bash
        working-directory: ${{ runner.temp }}/sample-tool
        run: |
          git init -q
          uv lock
          uv run --no-project python dev.py man
          uv run --no-project python dev.py check
      # The pre-push hook runs the static checks only: a failing test must not stop a push.
      - name: Check that the pre-push hook runs the static checks, not the tests
        shell: bash
        working-directory: ${{ runner.temp }}/sample-tool
        run: |
          printf '%s\n' 'def test_fails() -> None:' '    x = int("1")' '    assert x == 2' \
            > tests/test_fails.py
          sh git_hooks/pre-push < /dev/null
          rm tests/test_fails.py
      # ...and that it does run them: a lint error must stop the push.
      - name: Check that the pre-push hook rejects a lint error
        shell: bash
        working-directory: ${{ runner.temp }}/sample-tool
        run: |
          printf 'import os\n' > src/sample_tool/bad.py
          # Not `! sh ...`: bash -e ignores a negated command's status.
          if sh git_hooks/pre-push < /dev/null; then
            echo "The pre-push hook let a lint error through."; exit 1
          fi
          rm src/sample_tool/bad.py
      # `static` runs every check, so one run shows a formatting and a type error together.
      - name: Check that static reports every failure
        shell: bash
        working-directory: ${{ runner.temp }}/sample-tool
        run: |
          printf 'x: int = "a"\n' > src/sample_tool/bad_types.py
          printf 'y:int=1\n' > src/sample_tool/bad_format.py
          rc=0
          uv run --no-project python dev.py static > "$RUNNER_TEMP/static.log" 2>&1 || rc=$?
          rm src/sample_tool/bad_types.py src/sample_tool/bad_format.py
          test "$rc" != 0
          # Each file is only wrong for one check, so its name shows that check ran.
          grep -q 'bad_format.py' "$RUNNER_TEMP/static.log"
          grep -q 'bad_types.py' "$RUNNER_TEMP/static.log"
      # `man` makes each command's page from the README, which `man --check` and `static` then
      # check. Linux only: pandoc's output is the same everywhere, which "Check it" shows on
      # each system, as its `static` checks the page made on that system.
      - name: Check that man makes the page, and that a stale one fails the checks
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: ${{ runner.temp }}/sample-tool
        run: |
          set -euo pipefail
          dev() { uv run --no-project python dev.py "$@"; }
          fails() {
            rc=0
            dev "$@" > "$RUNNER_TEMP/man.log" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/man.log"
            test "$rc" != 0
          }
          page=man/sample-tool.1
          cp README.md "$RUNNER_TEMP/README.md"
          # "Check it" made it: the README's sections, but not Installing or Development.
          grep -qx '\.TH "SAMPLE\\-TOOL" "1" "" "sample\\-tool" "Sample Tool Manual"' "$page"
          grep -qx 'sample\\-tool \\- a sample tool' "$page"
          grep -qx '\.SH USING IT' "$page"
          if grep -qE '^\.SH (INSTALLING|DEVELOPMENT)' "$page"; then exit 1; fi
          # A README change makes it stale. Its ### heading is a subsection, and a link within the
          # README plain text.
          printf '\n## More\n\nSee [using it](#using-it).\n\n### Sub\n\nMore to say.\n' >> README.md
          fails man --check
          grep -q "$page" "$RUNNER_TEMP/man.log"
          fails static
          grep -q "$page" "$RUNNER_TEMP/man.log"
          dev man
          grep -qx '\.SH MORE' "$page"
          grep -qx 'See using it\.' "$page"
          grep -qx '\.SS Sub' "$page"
          dev man --check
          # A page no command has is stale too, and man removes it.
          cp "$page" man/old.1
          fails man --check
          grep -q man/old.1 "$RUNNER_TEMP/man.log"
          dev man
          test ! -e man/old.1
          # dev_project.py's sections to leave out, and SYNOPSIS, which comes before DESCRIPTION.
          printf '%s\n' 'MAN_SKIPPED_SECTIONS = {"Using it"}' \
            'MAN_SYNOPSIS = {"sample-tool": "**sample-tool** [*args*]"}' > dev_project.py
          dev man
          rm dev_project.py
          test "$(grep -E '^\.SH (NAME|SYNOPSIS|DESCRIPTION)$' "$page" | tr '\n' ' ')" = \
            '.SH NAME .SH SYNOPSIS .SH DESCRIPTION '
          grep -qx '\\f\[B\]sample\\-tool\\f\[R\] \[\\f\[I\]args\\f\[R\]\]' "$page"
          grep -qx '\.SH DEVELOPMENT' "$page"
          if grep -qx '\.SH USING IT' "$page"; then exit 1; fi
          # The pre-commit hook makes the page from the staged README, and stages it.
          git add README.md
          printf '\n## Unstaged\n\nNot committed.\n' >> README.md
          sh git_hooks/pre-commit
          git show ":$page" > "$RUNNER_TEMP/staged.1"
          diff "$RUNNER_TEMP/staged.1" "$page"
          grep -qx '\.SH MORE' "$page"
          if grep -qx '\.SH UNSTAGED' "$page"; then exit 1; fi
          git read-tree --empty  # unstage them
          # A commit naming its files (`git commit README.md`) can't stage the page in the real
          # index, so the hook stops it, leaving the index alone, and says how to commit.
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.com
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.com
          git add -A
          git commit -qm sample
          git config core.hooksPath git_hooks
          printf '\n## Later\n\nLater still.\n' >> README.md
          rc=0
          git commit -qm later README.md > "$RUNNER_TEMP/commit.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/commit.log"
          test "$rc" != 0
          grep -q 'dev.py man' "$RUNNER_TEMP/commit.log"
          git diff --cached --quiet
          dev man
          git add README.md "$page"
          git commit -qm later README.md "$page"  # nothing left to make: the hook lets it by
          git config --unset core.hooksPath
          # Back to the sample the later steps expect.
          cp "$RUNNER_TEMP/README.md" README.md
          dev man
          dev man --check
      # A NAME line lowercases a description's first word, unless it's an acronym. A package with
      # no commands, a library, has no page and nothing to check. Linux only, as above.
      - name: Check the NAME line's first word, and that a library gets no page
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: ${{ runner.temp }}/sample-tool
        run: |
          set -euo pipefail
          cp pyproject.toml "$RUNNER_TEMP"
          cp -R man "$RUNNER_TEMP/man"
          sed -i 's/^description = .*/description = "PRs to review."/' pyproject.toml
          uv run --no-project python dev.py man
          grep -qx 'sample\\-tool \\- PRs to review' man/sample-tool.1
          sed -i 's/^description = .*/description = "Command-line tool."/' pyproject.toml
          uv run --no-project python dev.py man
          grep -qx 'sample\\-tool \\- command\\-line tool' man/sample-tool.1
          rm -r man
          sed -i '/^\[project\.scripts\]$/,/^$/d' pyproject.toml
          if grep -q 'project\.scripts' pyproject.toml; then exit 1; fi
          uv run --no-project python dev.py man
          uv run --no-project python dev.py man --check
          test ! -e man
          # Back to the sample the later steps expect.
          cp "$RUNNER_TEMP/pyproject.toml" .
          mv "$RUNNER_TEMP/man" man
      # `venv` says when it rewrites uv.lock, once. On Linux only, as the sync is the same
      # everywhere. $CI is unset: with it, `uv sync --locked` fails on a stale lock instead.
      - name: Check that venv reports a changed uv.lock
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: ${{ runner.temp }}/sample-tool
        run: |
          cp pyproject.toml uv.lock "$RUNNER_TEMP"
          sed -i 's/^dependencies = \[\]$/dependencies = ["tzdata"]/' pyproject.toml
          grep -q '^dependencies = \["tzdata"\]$' pyproject.toml
          env -u CI uv run --no-project python dev.py venv 2> "$RUNNER_TEMP/venv1.log"
          test "$(grep -c 'uv.lock changed' "$RUNNER_TEMP/venv1.log")" = 1
          env -u CI uv run --no-project python dev.py venv 2> "$RUNNER_TEMP/venv2.log"
          test "$(grep -c 'uv.lock changed' "$RUNNER_TEMP/venv2.log")" = 0
          # Back to the sample the later steps expect.
          cp "$RUNNER_TEMP/pyproject.toml" "$RUNNER_TEMP/uv.lock" .
      # dev.py's --shard, as ci.yml runs it: the shards' tests, together, are the whole suite's,
      # each once, here too (pytest-xdist imports dev.py in each worker). More tests than the
      # sample's two, so each of the three shards gets several.
      - name: Check that the shards split the tests
        shell: bash
        working-directory: ${{ runner.temp }}/sample-tool
        run: |
          set -euo pipefail
          printf '%s\n' 'import pytest' '' '' '@pytest.mark.parametrize("n", range(20))' \
            'def test_n(n: int) -> None:' '    assert n >= 0' > tests/test_shards.py
          passed() {
            uv run --no-project python dev.py tests -q -rA "$@" | sed -n 's/^PASSED //p'
          }
          passed | sort > "$RUNNER_TEMP/all"
          for i in 1 2 3; do passed --shard "$i/3"; done | sort > "$RUNNER_TEMP/shards"
          test "$(grep -c . "$RUNNER_TEMP/all")" = 22
          diff "$RUNNER_TEMP/all" "$RUNNER_TEMP/shards"
          # A shard past the last is a usage error (4), not a run of no tests.
          rc=0
          uv run --no-project python dev.py tests --shard 4/3 > /dev/null 2>&1 || rc=$?
          test "$rc" = 4
      # `install` takes no link over from another clone that still has its target (unless told
      # to, with --replace), changes nothing if it refuses any (the man page's and a
      # dev_project.py's links included), and never installs a temporary clone. In a home of
      # its own, with its bin on PATH so that on Windows install doesn't add it to the user's
      # PATH.
      - name: Check that install leaves another clone's commands alone
        shell: bash
        working-directory: ${{ runner.temp }}/sample-tool
        run: |
          set -euo pipefail
          export HOME=$RUNNER_TEMP/home USERPROFILE=$RUNNER_TEMP/home TMPDIR=$RUNNER_TEMP/tmp
          mkdir -p "$TMPDIR"
          bin=$HOME/.local/bin
          PATH=$(cygpath -u "$bin" 2> /dev/null || echo "$bin"):$PATH
          # A project's own link; Windows makes no links but the commands'.
          printf '%s\n' 'from pathlib import Path' '' 'import dev' '' '' \
            'def install_links() -> list[tuple[Path, Path]]:' \
            '    link = Path.home() / ".local" / "share" / "sample-tool" / "README.md"' \
            '    return [] if dev.WINDOWS else [(link, dev.ROOT / "README.md")]' > dev_project.py
          own=$HOME/.local/share/sample-tool/README.md
          man=$HOME/.local/share/man/man1/sample-tool.1
          other=$RUNNER_TEMP/elsewhere
          cp -R . "$other"
          rm -rf "$other/.venv"
          install() { uv run --no-project python dev.py install "$@"; }
          refused() {
            rc=0
            install "$@" > "$RUNNER_TEMP/install.log" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/install.log"
            test "$rc" != 0
          }
          # What the command's link or shim runs.
          runs() {
            if [ "$RUNNER_OS" = Windows ]; then cat "$bin/sample-tool.cmd"; else readlink "$bin/sample-tool"; fi
          }
          mine() { runs | grep -qE '[/\\]sample-tool[/\\]\.venv'; }
          (cd "$other" && install)
          runs | grep -q elsewhere
          refused
          grep -q elsewhere "$RUNNER_TEMP/install.log"
          grep -q -- --replace "$RUNNER_TEMP/install.log"
          runs | grep -q elsewhere
          if [ "$RUNNER_OS" != Windows ]; then
            readlink "$man" | grep -q elsewhere
            readlink "$own" | grep -q elsewhere
            # The command's and the project's links are free, but the man page's isn't: none
            # changes.
            rm "$bin/sample-tool" "$own"
            refused
            test ! -e "$bin/sample-tool" && test ! -L "$bin/sample-tool"
            test ! -e "$own" && test ! -L "$own"
            readlink "$man" | grep -q elsewhere
          fi
          install --replace
          mine
          if [ "$RUNNER_OS" != Windows ]; then
            readlink "$man" | grep -qE '[/\\]sample-tool[/\\]man[/\\]sample-tool\.1$'
            readlink "$own" | grep -qE '[/\\]sample-tool[/\\]README\.md$'
          else
            test ! -e "$man"
          fi
          install  # this clone's own already
          mine
          (cd "$other" && refused)
          (cd "$other" && install --replace)
          runs | grep -q elsewhere
          # Once that clone is gone, its links lead nowhere, and install takes them.
          rm -rf "$other"
          install
          mine
          # A file install didn't write is left alone, even with --replace.
          link=$bin/sample-tool
          if [ "$RUNNER_OS" = Windows ]; then link=$bin/sample-tool.cmd; fi
          rm "$link"
          echo 'echo mine' > "$link"
          refused --replace
          test "$(cat "$link")" = 'echo mine'
          rm "$link"
          # Nor does it write a shim that another install's .exe, which Windows runs first, hides.
          if [ "$RUNNER_OS" = Windows ]; then
            touch "$bin/sample-tool.exe"
            refused --replace
            test ! -e "$bin/sample-tool.cmd"
            rm "$bin/sample-tool.exe"
          fi
          # A temporary clone is never installed, even with --replace: in the temporary directory,
          # or in /tmp, where macOS' temporary directory isn't.
          TMPDIR=$RUNNER_TEMP refused --replace
          grep -q 'dev.py venv' "$RUNNER_TEMP/install.log"
          if [ "$RUNNER_OS" != Windows ]; then
            scratch=$(mktemp -d /tmp/sample.XXXXXX)
            mkdir "$scratch/sample-tool"
            cp dev.py pyproject.toml "$scratch/sample-tool"  # all it reads to refuse
            (cd "$scratch/sample-tool" && refused --replace)
            grep -q 'temporary directory' "$RUNNER_TEMP/install.log"
            rm -rf "$scratch"
          fi
      # actionlint, with shellcheck for the scripts, catches a workflow GitHub would reject or
      # misread (a bad key or expression, an input that isn't declared), which the checks above
      # never run. Once: the workflows are the same on every system.
      - name: Lint the workflows
        if: matrix.lint
        shell: bash
        # Read-only and offline: actionlint only reads, and a fork's pull request is linted too.
        # Each repository is linted even if one fails, so a run shows every error. A project
        # that splits its tests (test_shards_*) too, for ci.yml's matrix of shards, and one whose
        # oldest and newest Python are the same.
        run: |
          uvx copier@9.19.1 copy --quiet --defaults --vcs-ref HEAD \
            -d project_name=sharded-tool -d "description=A sample tool." \
            -d "author_name=Sample Author" -d author_email=sample@example.com \
            -d test_shards_linux=2 -d test_shards_windows=3 . "$RUNNER_TEMP/sharded-tool"
          test "$(grep -c '^          - {os: windows-latest, .*, shards: 3}$' \
            "$RUNNER_TEMP/sharded-tool/.github/workflows/ci.yml")" = 6
          # The same oldest and newest Python is one Python in the matrix, not two jobs each.
          # Out of rapid development, for CI passed's strict verdict (checked below).
          uvx copier@9.19.1 copy --quiet --defaults --vcs-ref HEAD \
            -d project_name=one-python-tool -d "description=A sample tool." \
            -d "author_name=Sample Author" -d author_email=sample@example.com \
            -d min_python=3.14 -d newest_python=3.14 -d test_shards_windows=2 \
            -d rapid_development=false \
            . "$RUNNER_TEMP/one-python-tool"
          entries=$(grep '^          - {os: ' "$RUNNER_TEMP/one-python-tool/.github/workflows/ci.yml")
          test "$(grep -c . <<<"$entries")" = 4
          test -z "$(sort <<<"$entries" | uniq -d)"
          # actionlint looks for the repository's root.
          git -C "$RUNNER_TEMP/sample-tool" init -q
          git -C "$RUNNER_TEMP/sharded-tool" init -q
          git -C "$RUNNER_TEMP/one-python-tool" init -q
          image=$(docker build -q .github/actionlint)
          rc=0
          lint() {
            docker run --rm --network none -v "$1:/repo:ro" \
              -v "$GITHUB_WORKSPACE/.github/actionlint:/config:ro" -w /repo "$image" "${@:2}" ||
              rc=1
          }
          lint "$GITHUB_WORKSPACE"
          lint "$RUNNER_TEMP/sample-tool" -config-file /config/sample.yaml
          lint "$RUNNER_TEMP/sharded-tool" -config-file /config/sample.yaml
          lint "$RUNNER_TEMP/one-python-tool" -config-file /config/sample.yaml
          exit "$rc"
      # CI passed's verdict in a project in rapid development (the sample) and in one out of it,
      # against the jobs API's answers from real runs (see the script).
      - name: Check CI passed's verdict
        if: matrix.lint
        shell: bash
        run: |
          .github/ci-passed/test.sh "$RUNNER_TEMP/sample-tool/.github/workflows/ci.yml" \
            "$RUNNER_TEMP/one-python-tool/.github/workflows/ci.yml"

  # `copier update` in a project that has made the samples, PROJECT_AGENTS.md and docs/ its own,
  # added to pyproject.toml's lists and changed CI, to a later template commit that changes
  # them, dev.py, AGENTS.md, docs/ and CI, splitting its Windows tests in two as it does: it
  # must merge without conflicts, keep AGENTS.md current, merge ci.yml, and leave the samples,
  # PROJECT_AGENTS.md, docs/ and project.yml alone (see `_exclude` and `_skip_if_exists` in
  # copier.yml).
  update:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: copier update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Copier renders a commit, and reads the tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Update a project
        shell: bash
        run: |
          set -euo pipefail
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.com
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.com
          template=$RUNNER_TEMP/template project=$RUNNER_TEMP/sample-tool
          git clone -q . "$template"  # a copy to commit the later change to
          uvx copier@9.19.1 copy --quiet --defaults --vcs-ref HEAD -d project_name=sample-tool \
            -d "description=A sample tool." -d "author_name=Sample Author" \
            -d author_email=sample@example.com "$template" "$project"
          cd "$project"
          git init -q && git add -A && git commit -qm copy
          # The project's own changes.
          echo '"""The real CLI."""' > src/sample_tool/cli.py
          echo '"""The real package."""' > src/sample_tool/__init__.py
          echo '"""The real tests."""' > tests/test_cli.py
          echo '- An own rule.' >> PROJECT_AGENTS.md
          echo '- An own issue.' >> docs/issues.md
          echo '- An own step.' >> docs/roadmap.md
          sed -i -e 's/^dev = \[{ include-group = "template-dev" }\]$/dev = [\n    { include-group = "template-dev" },\n    "tzdata",\n]/' \
            -e 's/^    # The project.s own below:$/&\n    "OWN",/' pyproject.toml
          test "$(grep -cE '^    "(tzdata|OWN)",$' pyproject.toml)" = 3
          sed -i 's/^    timeout-minutes: 5$/    timeout-minutes: 4/' .github/workflows/ci.yml
          grep -q '^    timeout-minutes: 4$' .github/workflows/ci.yml
          echo '# The project'"'"'s own jobs.' >> .github/workflows/project.yml
          git commit -qam own
          # A later template commit.
          (cd "$template"
            sed -i '1i # A later change' template/dev.py template/src/*/*.py.jinja template/tests/test_cli.py.jinja \
              template/.github/workflows/ci.yml.jinja template/.github/workflows/project.yml
            sed -i '1i <!-- A later change -->' template/AGENTS.md template/PROJECT_AGENTS.md.jinja \
              template/docs/issues.md template/docs/roadmap.md.jinja
            sed -i -e 's/"ruff>=[^"]*"/"ruff>=99.0"/' -e 's/^    # The project.s own below:$/    "LATER",\n&/' \
              template/pyproject.toml.jinja
            git commit -qam later)
          # Splitting the Windows tests, as a project would, in the same update.
          uvx copier@9.19.1 update --quiet --defaults --vcs-ref HEAD -d test_shards_windows=2
          git status --short
          test -z "$(git diff --name-only --diff-filter=U)"
          if git grep -nE '^(<<<<<<<|>>>>>>>) '; then exit 1; fi
          test -z "$(git ls-files --others '*.rej')"
          git diff --quiet HEAD -- src/sample_tool/cli.py src/sample_tool/__init__.py tests/test_cli.py \
            PROJECT_AGENTS.md docs/issues.md docs/roadmap.md .github/workflows/project.yml
          grep -q '^<!-- A later change -->' AGENTS.md
          grep -q '^# A later change' .github/workflows/ci.yml
          grep -q '^    timeout-minutes: 4$' .github/workflows/ci.yml
          grep -q '^test_shards_windows: 2$' .copier-answers.yml
          grep -q '^          - {os: windows-latest, python: "3.15", shard: 2, shards: 2}$' \
            .github/workflows/ci.yml
          grep -q '^# A later change' dev.py
          grep -q '^# A later change' src/sample_tool/__main__.py
          grep -q '"ruff>=99.0"' pyproject.toml
          test "$(grep -cE '^    "(tzdata|OWN|LATER)",$' pyproject.toml)" = 5
