# Makes a project from the template and runs its checks with the oldest and newest Python the
# template defaults to, and lints its workflows and this one. On Linux; on macOS and Windows
# too when a pull request changes code that differs per system (and on main). All of it is
# skipped for a docs-only pull request.
name: template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's group is its number, the group cancel.yml's run joins when the pull request
# merges or closes, to cancel this run: keep the two names the same.
concurrency:
  group: template-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.run_attempt == 1 }}

jobs:
  # Whether anything but docs changed, as in the projects' ci.yml. A pull request touching only
  # the repository's own Markdown skips the other jobs; template/ is what projects get, so a
  # Markdown file there counts as code. main always runs them. No ruleset requires a check
  # here, so skipped jobs need no gate.
  #
  # `platform` is whether a changed file behaves differently per system, so the sample must run
  # on macOS and Windows too. A pull request that changes none of them gets Linux only, which
  # is where a rendering, `copier update` or workflow change shows. It is the files that branch
  # on the platform or run on all of them:
  #   - template/dev.py: WINDOWS, venv's Scripts and .exe, the PATH install.
  #   - template/git_hooks/: sh scripts that pick `py` on Windows.
  #   - template/.gitattributes: keeps the hooks' line endings Unix-style on Windows.
  #   - template/.github/actions/: the setup action every project job runs on each system.
  #   - this file: a change to the matrix should be seen on the systems it builds.
  # main always runs them all.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      code: ${{ steps.diff.outputs.code }}
      platform: ${{ steps.diff.outputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2  # the merge GitHub would make, and its first parent: the base
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "platform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Its own line, so a failing diff fails the step rather than reading as no code.
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if printf '%s\n' "$files" | grep -vE '\.md$' | grep -q . ||
            printf '%s\n' "$files" | grep -q '^template/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$files" | grep -qE \
            '^(template/(dev\.py|\.gitattributes|git_hooks/|\.github/actions/)|\.github/workflows/template\.yml)'; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
          else
            echo "platform=false" >> "$GITHUB_OUTPUT"
          fi

  sample:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5  # at most, as in the projects' ci.yml
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows only where `changes` says the change can differ there: their runners
        # are slower and costlier, and nothing else a pull request changes runs differently.
        os: ${{ fromJSON(needs.changes.outputs.platform == 'true' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        python: ["3.11", "3.15"]
        # The one job that lints the workflows. If the Pythons above change without this, it
        # adds a job of its own rather than linting nowhere.
        include:
          - os: ubuntu-latest
            python: "3.15"
            lint: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Copier renders a commit, and reads the tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}
      - name: Make a project
        shell: bash
        run: |
          uvx copier@9.19.1 copy --defaults --vcs-ref HEAD \
            -d project_name=sample-tool -d "description=A sample tool." \
            -d "author_name=Sample Author" -d author_email=sample@example.com \
            . "$RUNNER_TEMP/sample-tool"
      # As someone would after making it: dev.py then installs from the lock, which in CI
      # (where $CI is set) must already be there.
      - name: Check it
        shell: bash
        working-directory: ${{ runner.temp }}/sample-tool
        run: |
          git init -q
          uv lock
          uv run --no-project python dev.py check
      # dev.py's --shard, as ci.yml runs it: the shards' tests, together, are the whole suite's,
      # each once, here too (pytest-xdist imports dev.py in each worker). More tests than the
      # sample's two, so each of the three shards gets several.
      - name: Check that the shards split the tests
        shell: bash
        working-directory: ${{ runner.temp }}/sample-tool
        run: |
          set -euo pipefail
          printf '%s\n' 'import pytest' '' '' '@pytest.mark.parametrize("n", range(20))' \
            'def test_n(n: int) -> None:' '    assert n >= 0' > tests/test_shards.py
          passed() {
            uv run --no-project python dev.py tests -q -rA "$@" | sed -n 's/^PASSED //p'
          }
          passed | sort > "$RUNNER_TEMP/all"
          for i in 1 2 3; do passed --shard "$i/3"; done | sort > "$RUNNER_TEMP/shards"
          test "$(grep -c . "$RUNNER_TEMP/all")" = 22
          diff "$RUNNER_TEMP/all" "$RUNNER_TEMP/shards"
          # A shard past the last is a usage error (4), not a run of no tests.
          rc=0
          uv run --no-project python dev.py tests --shard 4/3 > /dev/null 2>&1 || rc=$?
          test "$rc" = 4
      # actionlint, with shellcheck for the scripts, catches a workflow GitHub would reject or
      # misread (a bad key or expression, an input that isn't declared), which the checks above
      # never run. Once: the workflows are the same on every system.
      - name: Lint the workflows
        if: matrix.lint
        shell: bash
        # Read-only and offline: actionlint only reads, and a fork's pull request is linted too.
        # Each repository is linted even if one fails, so a run shows every error. A project
        # that splits its tests (test_shards_*) too, for ci.yml's matrix of shards.
        run: |
          uvx copier@9.19.1 copy --quiet --defaults --vcs-ref HEAD \
            -d project_name=sharded-tool -d "description=A sample tool." \
            -d "author_name=Sample Author" -d author_email=sample@example.com \
            -d test_shards_linux=2 -d test_shards_windows=3 . "$RUNNER_TEMP/sharded-tool"
          test "$(grep -c '^          - {os: windows-latest, .*, shards: 3}$' \
            "$RUNNER_TEMP/sharded-tool/.github/workflows/ci.yml")" = 6
          # actionlint looks for the repository's root.
          git -C "$RUNNER_TEMP/sample-tool" init -q
          git -C "$RUNNER_TEMP/sharded-tool" init -q
          image=$(docker build -q .github/actionlint)
          rc=0
          lint() {
            docker run --rm --network none -v "$1:/repo:ro" \
              -v "$GITHUB_WORKSPACE/.github/actionlint:/config:ro" -w /repo "$image" "${@:2}" ||
              rc=1
          }
          lint "$GITHUB_WORKSPACE"
          lint "$RUNNER_TEMP/sample-tool" -config-file /config/sample.yaml
          lint "$RUNNER_TEMP/sharded-tool" -config-file /config/sample.yaml
          exit "$rc"

  # `copier update` in a project that has made the samples, PROJECT_AGENTS.md and docs/ its own,
  # added to pyproject.toml's lists and changed CI, to a later template commit that changes
  # them, dev.py, AGENTS.md, docs/ and CI, splitting its Windows tests in two as it does: it
  # must merge without conflicts, keep AGENTS.md current, merge ci.yml, and leave the samples,
  # PROJECT_AGENTS.md, docs/ and project.yml alone (see `_exclude` and `_skip_if_exists` in
  # copier.yml).
  update:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: copier update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Copier renders a commit, and reads the tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Update a project
        shell: bash
        run: |
          set -euo pipefail
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.com
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.com
          template=$RUNNER_TEMP/template project=$RUNNER_TEMP/sample-tool
          git clone -q . "$template"  # a copy to commit the later change to
          uvx copier@9.19.1 copy --quiet --defaults --vcs-ref HEAD -d project_name=sample-tool \
            -d "description=A sample tool." -d "author_name=Sample Author" \
            -d author_email=sample@example.com "$template" "$project"
          cd "$project"
          git init -q && git add -A && git commit -qm copy
          # The project's own changes.
          echo '"""The real CLI."""' > src/sample_tool/cli.py
          echo '"""The real package."""' > src/sample_tool/__init__.py
          echo '"""The real tests."""' > tests/test_cli.py
          echo '- An own rule.' >> PROJECT_AGENTS.md
          echo '- An own issue.' >> docs/issues.md
          echo '- An own step.' >> docs/roadmap.md
          sed -i -e 's/^dev = \[{ include-group = "template-dev" }\]$/dev = [\n    { include-group = "template-dev" },\n    "tzdata",\n]/' \
            -e 's/^    # The project.s own below:$/&\n    "OWN",/' pyproject.toml
          test "$(grep -cE '^    "(tzdata|OWN)",$' pyproject.toml)" = 3
          sed -i 's/^    timeout-minutes: 5$/    timeout-minutes: 4/' .github/workflows/ci.yml
          grep -q '^    timeout-minutes: 4$' .github/workflows/ci.yml
          echo '# The project'"'"'s own jobs.' >> .github/workflows/project.yml
          git commit -qam own
          # A later template commit.
          (cd "$template"
            sed -i '1i # A later change' template/dev.py template/src/*/*.py.jinja template/tests/test_cli.py.jinja \
              template/.github/workflows/ci.yml.jinja template/.github/workflows/project.yml
            sed -i '1i <!-- A later change -->' template/AGENTS.md template/PROJECT_AGENTS.md.jinja \
              template/docs/issues.md template/docs/roadmap.md.jinja
            sed -i -e 's/"ruff>=[^"]*"/"ruff>=99.0"/' -e 's/^    # The project.s own below:$/    "LATER",\n&/' \
              template/pyproject.toml.jinja
            git commit -qam later)
          # Splitting the Windows tests, as a project would, in the same update.
          uvx copier@9.19.1 update --quiet --defaults --vcs-ref HEAD -d test_shards_windows=2
          git status --short
          test -z "$(git diff --name-only --diff-filter=U)"
          if git grep -nE '^(<<<<<<<|>>>>>>>) '; then exit 1; fi
          test -z "$(git ls-files --others '*.rej')"
          git diff --quiet HEAD -- src/sample_tool/cli.py src/sample_tool/__init__.py tests/test_cli.py \
            PROJECT_AGENTS.md docs/issues.md docs/roadmap.md .github/workflows/project.yml
          grep -q '^<!-- A later change -->' AGENTS.md
          grep -q '^# A later change' .github/workflows/ci.yml
          grep -q '^    timeout-minutes: 4$' .github/workflows/ci.yml
          grep -q '^test_shards_windows: 2$' .copier-answers.yml
          grep -q '^          - {os: windows-latest, python: "3.15", shard: 2, shards: 2}$' \
            .github/workflows/ci.yml
          grep -q '^# A later change' dev.py
          grep -q '^# A later change' src/sample_tool/__main__.py
          grep -q '"ruff>=99.0"' pyproject.toml
          test "$(grep -cE '^    "(tzdata|OWN|LATER)",$' pyproject.toml)" = 5
