# Makes a project from the template and runs its checks on Linux, macOS and Windows, with the
# oldest and newest Python the template defaults to.
name: template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: template-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sample:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Copier renders a commit, and reads the tags
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Make a project
        shell: bash
        run: |
          uvx copier@9.19.1 copy --defaults --vcs-ref HEAD \
            -d project_name=sample-tool -d "description=A sample tool." \
            -d "author_name=Sample Author" -d author_email=sample@example.com \
            . "$RUNNER_TEMP/sample-tool"
      # As someone would after making it: dev.py then installs from the lock, which in CI
      # (where $CI is set) must already be there.
      - name: Check it
        shell: bash
        working-directory: ${{ runner.temp }}/sample-tool
        run: |
          git init -q
          uv lock
          uv run --no-project python dev.py check
